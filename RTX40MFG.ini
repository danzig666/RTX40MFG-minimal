[MFG]
; 0 = follow the game's own choice (recommended once the game's menu shows
;     2x..6x -- the arch gates make that happen).
; 2, 3, 4 = force that multiplier regardless of what the game asks.
Multiplier=0

; Write RTX40MFG.log beside the game executable. 1 = on, 0 = off.
Log=1

; The device-support NOP inherited from the upstream project. Not needed on
; the providers tested so far; its exact effect is undocumented. 0 = off.
LegacyNgxPatch=0

; Diagnostic. 0 = do NOT apply the Ada temporal correction. Frame generation
; then runs NVIDIA's stock Ada kernel (expect midpoint artifacts at 3x+), which
; tells you whether the rebuilt kernel is what stops frames from appearing.
AdaTemporalPatch=1

; Diagnostic. 0 = leave the provider's architecture comparisons alone. The
; advertised maximum then stays at the stock Ada value (1 = 2x only). This is
; the baseline every other run is compared against.
ArchGates=1

; Diagnostic. 0 = leave the Streamline plugin's flip-metering flag alone.
FlipMetering=1

; Diagnostic. 0 = leave the Streamline plugin's generated-frame clamp alone.
StreamlineMax=1

; Diagnostic. 0 = never verify the adapter inside CreateFeature. Normal runs
; verify at slSetD3DDevice, well before; this only matters if that never ran.
VerifyAtCreate=1
