[MFG]
; 0 = follow the game's own choice (recommended: once the arch gates raise the
;     advertised maximum, the game's menu shows 2x..6x and its choice is yours).
; 2, 3, 4 = force that multiplier regardless of what the game asks.
Multiplier=0

; Write RTX40MFG.log beside the game executable. 1 = on, 0 = off.
Log=1

; ---------------------------------------------------------------------------
; Everything below is a diagnostic switch. The defaults are the configuration
; confirmed working on real hardware. Change them only to bisect a failure.
; ---------------------------------------------------------------------------

; Rewrite the provider's architecture comparisons (0x1b0 -> 0x190) so Ada is
; allowed to advertise and generate more than one frame. 0 = stock Ada (2x).
ArchGates=1

; Publish the rebuilt Ada kernel with correct temporal positions for 3x+.
; 0 = NVIDIA's stock Ada kernel (works, but 3x+ collapses onto the midpoint).
AdaTemporalPatch=1

; Force the Streamline plugin onto software (RSYNC) pacing. Ada has no
; hardware flip metering; without this 3x+ freezes the image.
FlipMetering=1

; Remove the Streamline plugin's clamp on the requested frame count.
StreamlineMax=1

; Write inline detours into the provider's CreateFeature / EvaluateFeature
; exports to log NVIDIA's result codes. CONFIRMED TO BREAK FEATURE CREATION
; on provider 310.7.128 -- NVIDIA answers PlatformError while they are
; present. Turn on only to read a result code, never for play.
NgxHooks=0

; If the adapter was somehow not verified at slSetD3DDevice, allow verifying
; it inside CreateFeature (only reachable with NgxHooks=1).
VerifyAtCreate=1

; The device-support NOP inherited from the upstream project. Not needed on
; the providers tested; its exact effect is undocumented.
LegacyNgxPatch=0
