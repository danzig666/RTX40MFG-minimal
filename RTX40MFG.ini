[MFG]
; 0 = follow the game's own choice (recommended once the game's menu shows
;     2x..6x -- the arch gates make that happen).
; 2, 3, 4 = force that multiplier regardless of what the game asks.
Multiplier=0

; Write RTX40MFG.log beside the game executable. 1 = on, 0 = off.
Log=1

; The device-support NOP inherited from the upstream project. Not needed on
; the providers tested so far; its exact effect is undocumented. 0 = off.
LegacyNgxPatch=0
